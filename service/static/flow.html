<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twin Pipeline</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1b19;--muted:#6b6862;--card:#fff;--line:#e2dfd8;--accent:#1f6feb;--ok:#1a7f37;--warn:#b35900;--bad:#c62828;--glow:rgba(31,111,235,.25);--map:#fbfaf7;--wall:#2b2a28}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--fg:#eceae4;--muted:#9a978f;--card:#1d1c1a;--line:#33312d;--accent:#3b82f6;--ok:#2ea043;--warn:#d9822b;--bad:#e5484d;--glow:rgba(59,130,246,.35);--map:#171716;--wall:#d8d5cc}}
:root[data-theme="dark"]{--bg:#121211;--fg:#eceae4;--muted:#9a978f;--card:#1d1c1a;--line:#33312d;--accent:#3b82f6;--ok:#2ea043;--warn:#d9822b;--bad:#e5484d;--glow:rgba(59,130,246,.35);--map:#171716;--wall:#d8d5cc}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:6px 0 2px}
.muted{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
select,button{font:inherit;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.primary{background:var(--accent);color:#fff;border:0;font-weight:600}
.row{display:flex;align-items:stretch;overflow-x:auto;padding:14px 4px 18px;scroll-behavior:smooth;scrollbar-width:thin}
.mod{flex:0 0 116px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;
     transition:transform .35s,box-shadow .35s,border-color .35s;position:relative}
.mod .ic{font-size:1.5rem;line-height:1.2}
.mod b{display:block;font-size:.82rem;margin-top:2px}
.mod small{display:block;color:var(--muted);font-size:.7rem;line-height:1.25;margin-top:2px}
.mod.on{transform:translateY(-6px) scale(1.06);border-color:var(--accent);box-shadow:0 8px 24px var(--glow)}
.mod.done{border-color:var(--ok)}
.mod .step{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;border-radius:999px;padding:0 7px}
.mod.ai{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#a855f7,#3b82f6) border-box;border:2px solid transparent}
.link{flex:0 0 34px;position:relative;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px)}
.link i{position:absolute;top:-4px;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:0}
.link.go i{animation:packet 1.1s ease-in-out infinite}
@keyframes packet{0%{left:-5px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:29px;opacity:0}}
.phase{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px 4px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
.stage h2{margin:0;font-size:1.2rem}
.stage .what{margin:4px 0 12px}
.io{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:170px;opacity:0;transform:translateX(-18px);transition:opacity .5s,transform .5s;min-width:0;overflow:hidden}
.box.out{transform:translateX(18px)}
.box.show{opacity:1;transform:none}
.box h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.arrow{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.arrow i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s ease}
.arrow.fill i{width:100%}
.arrow+div{font-size:.7rem;text-align:center;color:var(--muted);margin-top:4px}
img.ex{max-width:100%;max-height:230px;border-radius:8px;display:block;margin:auto}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--line)}
pre{margin:0;font-size:.72rem;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
canvas{width:100%;display:block;border-radius:8px;background:var(--map)}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.82rem}
.kv b{font-size:1rem}
.flip{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px 8px;font-size:.84rem;align-items:center}
.flip .old{color:var(--muted);text-decoration:line-through}
.flip .new{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.flip .new.show{opacity:1;transform:none}
.t-fixed{color:var(--ok)}.t-rare{color:var(--accent)}.t-often{color:var(--warn)}.t-ignore{color:var(--muted)}
.note{margin-top:10px;font-size:.88rem;border-left:4px solid var(--accent);padding:4px 10px;background:var(--bg);border-radius:0 8px 8px 0}
@media (max-width:640px){.io{grid-template-columns:1fr}.arrow{height:6px;width:60%;margin:auto}.box{min-height:0}}
</style>
</head>
<body>
<main>
<h1>From a phone walk to a duck that finds its way</h1>
<p class="muted">Every module of House Twin Patrol in one row, with what goes in and what comes out, using a real scan.
Press play for the tour, or tap any module. Purple border = the only step that may call an AI model.</p>
<div class="bar"><select id="sid" aria-label="Scan" style="flex:1;min-width:0"></select>
  <button class="primary" id="play">▶ Play the tour</button><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
<div class="phase" id="phases"></div>
<div class="row" id="row"></div>
<section class="stage" aria-live="polite">
  <h2 id="title"></h2><div class="what muted" id="what"></div>
  <div class="io"><div class="box" id="in"></div><div><div class="arrow" id="arrow"><i></i></div><div id="via"></div></div><div class="box out" id="out"></div></div>
  <div class="note" id="note"></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const store = {get: k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
               set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }};
const q = new URLSearchParams(location.search);
if (q.get('k')) store.set('key', q.get('k'));
const KEY = q.get('k') || store.get('key') || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const api = path => fetch(path, {headers: {'X-API-Key': KEY}}).then(r => r.ok ? r : Promise.reject(new Error(r.status)));
const sid = () => encodeURIComponent($('sid').value);
const blob = async path => URL.createObjectURL(await (await api(path)).blob());
const kv = pairs => `<div class="kv">${pairs.map(([v, l]) => `<span><b>${esc(v)}</b> ${esc(l)}</span>`).join('')}</div>`;
let D = {}, cur = 0, timer = null, anim = null;

// [icon, name, file, phase, what it does, in label, out label, via]
const M = [
  ['📱', 'Capture', 'iPhone app', 'Step 1 · capture', 'Walk the home with the Twin LiDAR app: 4 times a second it saves a photo, a LiDAR depth image and the phone\'s pose. You tap rooms, crouch for a level duck-height look, and tag fixed things.', 'your walk', 'frames + depth + poses', 'ARKit'],
  ['☁️', 'Upload', 'service/app.py', 'Step 1 · capture', 'One zip goes to your server, which starts building the house by itself.', 'scan zip', 'build job', 'HTTPS'],
  ['📂', 'Read', 'twin/scan_io.py', 'Step 2 · map', 'Opens the zip, keeps frames with good tracking, applies your zone taps and tags (bad tags are dropped).', 'zip', 'clean frames', 'checks'],
  ['🧊', 'Fuse 3D', 'twin/fuse.py', 'Step 2 · map', 'Every depth image is fused into one 3D model with OpenCV 5\'s TSDF volume (2.5 cm); gravity says which way is up.', 'depth + poses', '3D surface', 'OpenCV TSDF'],
  ['📏', 'Local floor', 'twin/fuse.py', 'Step 2 · map', 'Finds the floor under every 50 cm, so steps and sunken rooms don\'t turn rugs into furniture.', 'upward surfaces', 'floor tiles', 'tiles'],
  ['🗺️', 'Floor plan', 'twin/floorplan.py', 'Step 2 · map', 'The floor you walked, grown out until walls and glass stop it; zones become rooms, narrow openings become doors.', 'surface + path + zones', 'rooms, walls, doors', 'OpenCV'],
  ['🔎', 'Landmarks', 'twin/landmarks.py', 'Step 2 · map', 'The object detector (YOLOX via OpenCV dnn) on the photos; each box is lifted to 3D with the depth and merged across views.', 'photos + depth', 'candidates', 'YOLOX'],
  ['🧠', 'Check', 'twin/curate.py', 'Step 2 · map', 'What is each candidate really, keep or drop, how often does it move? CLIP (OpenCV dnn, offline) decides alone when sure; Gemini only sees the doubtful crops.', 'crops + context', 'trusted landmarks', 'CLIP → Gemini'],
  ['🛋️', 'Furniture', 'twin/furniture.py', 'Step 2 · map', 'What stands in the duck\'s way: height layers cut into seats, tables and counters.', '3D points', 'obstacle boxes', 'layers'],
  ['🧱', 'Occupancy', 'twin/house.py', 'Step 2 · map', 'The clean surface as a 3D grid: the duck checks its distance sensor against the real shapes at its own height.', 'surface', 'house.json + grid', 'grid'],
  ['🏠', 'Twin', 'agent/twin_sim.py', 'Steps 3–4 · duck', 'house.json becomes a MuJoCo physics scene with a duck-height camera, Pollen\'s 8×8 distance sensor and drifting odometry.', 'house.json', 'simulated home', 'MuJoCo'],
  ['📍', 'Where am I', 'agent/localize.py', 'Steps 3–4 · duck', '2,000 guesses over the whole floor, reweighted by every distance frame and object sighting. No stickers.', 'sensors', 'guess + confidence', 'particles'],
  ['🦆', 'Patrol', 'agent/mission.py', 'Steps 3–4 · duck', 'Unsure: look around. Sure: A* route from the guess, follow its corners, arrive, say the room, next goal.', 'guess + goals', 'arrivals', 'A* + steering'],
  ['🏁', 'Score', 'agent/mission.py', 'Steps 3–4 · duck', 'The simulator knows the truth, so every claim is checked: really arrived? right room? how far off? bumps?', 'claims + truth', 'scorecard', 'compare']];

async function start() {
  if (!KEY) return $('title').textContent = 'Missing access key: open the full link once (it ends in ?k=…).';
  const ids = await (await api('/lidar/sessions')).json();
  $('sid').innerHTML = ids.map(i => `<option>${esc(i)}</option>`).join('');
  if (q.get('s') && ids.includes(q.get('s'))) $('sid').value = q.get('s');
  $('row').innerHTML = M.map((m, i) => `${i ? `<div class="link" id="l${i}"><i></i></div>` : ''}<div class="mod${m[1] === 'Check' ? ' ai' : ''}" id="m${i}" role="button" tabindex="0" aria-label="${m[1]}">
    <span class="step">${i + 1}</span><div class="ic">${m[0]}</div><b>${m[1]}</b><small>${m[2]}</small></div>`).join('');
  M.forEach((_, i) => { $(`m${i}`).onclick = () => { stop(); show(i); }; $(`m${i}`).onkeydown = e => e.key === 'Enter' && (stop(), show(i)); });
  $('play').onclick = () => timer ? stop() : play();
  $('prev').onclick = () => { stop(); show(Math.max(0, cur - 1)); };
  $('next').onclick = () => { stop(); show(Math.min(M.length - 1, cur + 1)); };
  $('sid').onchange = load;
  load();
}

async function load() {
  D = {};
  const [st, cap] = await Promise.all([api(`/lidar/status?session=${sid()}`).then(r => r.json()), api(`/lidar/capture?session=${sid()}`).then(r => r.json()).catch(() => null)]);
  D.st = st; D.cap = cap; D.r = st.report || {};
  D.frames = await api(`/lidar/frames?session=${sid()}`).then(r => r.json()).catch(() => []);
  D.mission = await api(`/lidar/file?session=${sid()}&name=mission.json`).then(r => r.json()).catch(() => null);
  D.house = D.mission?.house || await api(`/lidar/file?session=${sid()}&name=house.json`).then(r => r.json()).catch(() => null);
  show(Math.min(M.length - 1, Math.max(0, (+q.get('m') || 1) - 1)));  // ?m=8 opens module 8
}

function play() { $('play').textContent = '❚❚ Pause'; timer = setInterval(() => show((cur + 1) % M.length), 7000); show(cur); }
function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Play the tour'; }

function show(i) {
  cur = i;
  cancelAnimationFrame(anim);
  M.forEach((_, k) => { $(`m${k}`).classList.toggle('on', k === i); $(`m${k}`).classList.toggle('done', k < i);
    if (k) $(`l${k}`).classList.toggle('go', k === i); });
  $(`m${i}`).scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
  const m = M[i];
  $('phases').textContent = m[3];
  $('title').textContent = `${i + 1}. ${m[1]}`;
  $('what').innerHTML = `${esc(m[4])} <code>${esc(m[2])}</code>`;
  ['in', 'out'].forEach(b => $(b).classList.remove('show'));
  $('arrow').classList.remove('fill');
  $('via').textContent = m[7];
  const ex = EX[i]();
  $('in').innerHTML = `<h3>In · ${esc(m[5])}</h3>${ex.in}`;
  $('out').innerHTML = `<h3>Out · ${esc(m[6])}</h3>${ex.out}`;
  $('note').innerHTML = ex.note || '';
  setTimeout(() => $('in').classList.add('show'), 80);
  setTimeout(() => $('arrow').classList.add('fill'), 600);
  setTimeout(() => { $('out').classList.add('show'); ex.after && ex.after(); }, 1600);
}

const img = (id, path) => { blob(path).then(u => { const e = $(id); if (e) e.src = u; }).catch(() => {}); return `<img class="ex" id="${id}" alt="">`; };
const thumbs = (n, size = 160) => { const pick = D.frames.filter((_, k) => k % Math.max(1, Math.floor(D.frames.length / n)) === 0).slice(0, n);
  setTimeout(() => pick.forEach(p => blob(`/lidar/frame?session=${sid()}&i=${p.i}&size=${size}`).then(u => { const e = $(`t${p.i}`); if (e) e.src = u; })), 0);
  return `<div class="thumbs">${pick.map(p => `<img id="t${p.i}" alt="${esc(p.room)} at ${p.t} s">`).join('')}</div>`; };

const EX = [
  () => { const c = D.cap, f = c?.frames || [], dur = f.length ? f[f.length - 1].t : 0;
    const low = f.filter(x => x.h != null && x.h < (c?.low_h || 0.75)), level = low.filter(x => Math.abs(x.pitch) < 25);
    return {in: `${thumbs(4)}<div class="muted" style="margin-top:6px">${Math.floor(dur / 60)} min ${Math.round(dur % 60)} s of walking, ${new Set(f.map(x => x.room)).size} zone(s), ${c?.tags?.length || 0} tags</div>`,
      out: `<pre>${esc(JSON.stringify({i: 120, t: 30.1, rgb: 'rgb/000120.jpg', depth: 'depth/000120.bin', K: [692, 692, 480, 360], T: '4×4 pose', tracking: 'normal', room: f[60]?.room, h: f[60]?.h_app}, null, 1))}</pre>
        ${kv([[D.r.frames, 'frames'], [low.length * 2, 'low'], [level.length * 2, 'low + level']])}`,
      note: level.length < 20 ? 'This scan has almost no level duck-height frames: the app now counts a direction only when the phone is low <em>and</em> level.' : ''}; },
  () => ({in: kv([[`${D.cap?.mb ?? '–'} MB`, 'zip'], [D.r.frames, 'frames']]), out: `<pre>python -m twin build lidar.zip --out house/</pre>${kv([[Math.round(Object.values(D.r.timings_s || {}).reduce((a, b) => a + b, 0)) + ' s', 'build time']])}`,
    note: 'The app keeps the screen on while uploading and shows the result when the build finishes.'}),
  () => ({in: kv([['lidar.zip', ''], [D.r.frames, 'frames']]), out: kv([[`${D.r.frames_used}/${D.r.frames}`, 'good tracking'], [D.r.tags, 'tags'], [Object.keys(D.r.zones || {}).length, 'zones']])}),
  () => ({in: thumbs(4), out: `<canvas id="cloud" height="220" aria-label="Rotating 3D point cloud"></canvas>${kv([[((D.r.tsdf_points || 0) / 1000).toFixed(0) + 'k', 'surface points'], [D.r.manhattan_deg + '°', 'wall direction']])}`,
    after: spinCloud}),
  () => ({in: '<div class="muted">every surface that faces up and lies below 35 cm</div>', out: img('fl', `/lidar/file?session=${sid()}&name=stage_floor.png`),
    note: 'Your new flat has two floor levels 13 cm apart; with one floor height for the whole home, rugs became “seats”.'}),
  () => ({in: '<div class="muted">the 3D surface, your walking path and the zones you tapped</div>', out: img('tp', `/lidar/file?session=${sid()}&name=top.png`) +
    kv(Object.entries(D.r.spaces || {}).map(([n, v]) => [`${v.w_m}×${v.l_m} m`, n]).concat([[D.r.doors, 'doors']]))}),
  () => ({in: thumbs(4, 200), out: kv([[D.r.landmark_candidates, 'candidates'], [(D.st.candidates || []).reduce((a, c) => a + c.low_views, 0), 'seen from low']]) +
    `<div class="flip" style="margin-top:8px">${(D.st.candidates || []).slice(0, 8).map(c => `<span>${esc(c.cls || c.label)}</span><span class="muted">${c.views} views</span><span></span><span></span>`).join('')}</div>`}),
  () => { const C = (D.st.candidates || []).slice(0, 10), cur8 = D.r.curate || {};
    return {in: `<div class="flip">${C.map(c => `<span>${esc(c.cls || c.label)}</span><span class="muted">${(c.size || []).slice(0, 2).map(v => v.toFixed(1)).join('×')} m</span><span></span><span></span>`).join('')}</div>`,
      out: `<div class="flip">${C.map((c, k) => `<span class="old">${esc(c.label)}</span><span>→</span><span class="new" data-k="${k}">${esc(c.decision.label)}</span><span class="new t-${esc(c.decision.keep ? c.decision.mobility : 'ignore')}" data-k="${k}">${c.decision.keep ? esc(c.decision.mobility) : 'dropped'}</span>`).join('')}</div>`,
      note: `Checked by <b>${esc(cur8.by)}</b>${cur8.asked ? ` · ${esc(cur8.asked)} crops went to ${esc(cur8.model)}` : ''}. On 5 real maps: CLIP alone 75 % right, hybrid 95 %, Gemini 97 %, Haiku 77 %.`,
      after: () => document.querySelectorAll('.flip .new').forEach(e => setTimeout(() => e.classList.add('show'), 200 * +e.dataset.k))}; },
  () => { const by = {}; (D.house?.objects || []).forEach(o => by[o.label] = (by[o.label] || 0) + 1);
    return {in: '<div class="muted">3D points between 20 cm and 1.2 m above the local floor</div>', out: kv(Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([l, n]) => [n, l]))}; },
  () => ({in: '<div class="muted">the fused 3D surface</div>', out: img('oc', `/lidar/file?session=${sid()}&name=stage_occupancy.png`) +
    `<div class="muted">cyan: what a 20 cm sensor hits · <a href="/lidar/3d?s=${sid()}">open the 3D view</a></div>`}),
  () => ({in: kv([[D.house?.walls?.length, 'walls'], [D.house?.objects?.length, 'boxes'], [D.house?.landmarks?.length, 'landmarks']]),
    out: '<canvas id="twin" height="240" aria-label="The simulated home"></canvas>', after: () => drawMap('twin', 0)}),
  () => ({in: '<div class="muted">8×8 distance frames, objects in view, odometry</div>', out: '<canvas id="loc" height="240" aria-label="The duck finding itself"></canvas><div class="muted" id="locs"></div>',
    after: () => replay('loc', 0, 90)}),
  () => ({in: kv([[D.mission?.goals?.length, 'goals'], ['A*', 'route']]), out: '<canvas id="pat" height="240" aria-label="The patrol"></canvas><div class="muted" id="pats"></div>',
    after: () => replay('pat', 0, 1e9, 6)}),
  () => { const s = D.mission?.summary; if (!s) return {in: '', out: '<div class="muted">No patrol simulated for this scan yet.</div>'};
    const E = D.mission.episodes, reached = E.reduce((a, e) => a + e.reached, 0), goals = E.reduce((a, e) => a + e.goals, 0);
    return {in: kv([[E.length, 'patrols'], [D.mission.goals.length, 'goals each']]), out: kv([[`${reached}/${goals}`, 'reached'], [s.found_s_median + ' s', 'to find itself'],
      [Math.round(s.err_when_sure_median_m * 100) + ' cm', 'error when sure'], [s.room_right_pct_median + ' %', 'right room'], [s.bumps_total, 'bumps']]) +
      `<div class="muted" style="margin-top:6px"><a href="/lidar/mission?s=${sid()}">watch every patrol</a></div>`}; }];

async function spinCloud() {
  if (!D.cloud) {
    const buf = await api(`/lidar/file?session=${sid()}&name=cloud.bin`).then(r => r.arrayBuffer()).catch(() => null);
    if (!buf) return;
    const h = new DataView(buf, 0, 16), n = h.getUint32(12, true), cm = new Uint16Array(buf, 16, n * 3), rgb = new Uint8Array(buf, 16 + n * 6, n * 3);
    const step = Math.max(1, Math.floor(n / 15000)), P = [];
    for (let i = 0; i < n; i += step) P.push([cm[3 * i] / 100, cm[3 * i + 1] / 100, cm[3 * i + 2] / 100, rgb[3 * i], rgb[3 * i + 1], rgb[3 * i + 2]]);
    const mx = P.reduce((a, p) => [Math.max(a[0], p[0]), Math.max(a[1], p[1])], [0, 0]);
    D.cloud = P.map(p => [p[0] - mx[0] / 2, p[1] - mx[1] / 2, p[2], `rgb(${p[3]},${p[4]},${p[5]})`]).filter(p => p[2] < 1.6);
    D.cloudR = Math.max(...mx) / 2;
  }
  const c = $('cloud'); if (!c) return;
  const W = c.width = c.clientWidth * devicePixelRatio, H = c.height = 220 * devicePixelRatio, g = c.getContext('2d');
  let a = 0;
  const frame = () => {
    if (!$('cloud')) return;
    g.clearRect(0, 0, W, H); a += 0.01;
    const s = Math.min(W, H) / (2.3 * D.cloudR), ca = Math.cos(a), sa = Math.sin(a);
    for (const [x, y, z, col] of D.cloud) {
      const u = x * ca - y * sa, v = x * sa + y * ca;
      g.fillStyle = col; g.fillRect(W / 2 + u * s, H * 0.62 + v * s * 0.45 - z * s * 0.8, 1.6 * devicePixelRatio, 1.6 * devicePixelRatio);
    }
    anim = requestAnimationFrame(frame);
  };
  frame();
}

function frameOf(id) {
  const c = $(id), h = D.house, xs = h.walls.flatMap(w => [w.a[0], w.b[0]]), ys = h.walls.flatMap(w => [w.a[1], w.b[1]]);
  const B = {x0: Math.min(...xs) - 0.3, x1: Math.max(...xs) + 0.3, y0: Math.min(...ys) - 0.3, y1: Math.max(...ys) + 0.3};
  const W = c.clientWidth, s = Math.min(W / (B.x1 - B.x0), 240 / (B.y1 - B.y0));
  c.width = W * devicePixelRatio; c.height = 240 * devicePixelRatio;
  const g = c.getContext('2d'); g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const ox = (W - (B.x1 - B.x0) * s) / 2;
  return {g, P: (x, y) => [ox + (x - B.x0) * s, (B.y1 - y) * s], s};
}

function drawMap(id, k, steps) {
  if (!D.house || !$(id)) return;
  const {g, P, s} = frameOf(id), css = getComputedStyle(document.documentElement), h = D.house;
  g.fillStyle = css.getPropertyValue('--line');
  h.objects.forEach(o => { const [x, y] = P(o.center[0] - o.size[0] / 2, o.center[1] + o.size[1] / 2); g.fillRect(x, y, o.size[0] * s, o.size[1] * s); });
  g.strokeStyle = css.getPropertyValue('--wall'); g.lineCap = 'round';
  h.walls.forEach(w => { g.lineWidth = Math.max(2, w.t * s); g.beginPath(); g.moveTo(...P(...w.a)); g.lineTo(...P(...w.b)); g.stroke(); });
  g.fillStyle = '#f59e0b'; h.landmarks.forEach(l => { const [x, y] = P(...l.center); g.fillText('★', x - 4, y + 4); });
  (D.mission?.goals || []).forEach((q, i) => { const [x, y] = P(...q.xy); g.beginPath(); g.arc(x, y, 8, 0, 7); g.fillStyle = 'rgba(128,128,128,.55)'; g.fill(); g.fillStyle = '#fff'; g.fillText(i + 1, x - 3, y + 4); });
  if (!steps) return;
  const st = steps[k], line = (a, b, col) => { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); steps.slice(0, k + 1).forEach((p, j) => { const [x, y] = P(p[a], p[b]); j ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); };
  line(1, 2, css.getPropertyValue('--wall'));
  const dot = (x, y, col, fill) => { const [px, py] = P(x, y); g.beginPath(); g.arc(px, py, 6, 0, 7); g.strokeStyle = col; g.lineWidth = 2; g.stroke(); if (fill) { g.fillStyle = col; g.fill(); } };
  dot(st[1], st[2], css.getPropertyValue('--wall'), true);
  dot(st[4], st[5], css.getPropertyValue('--accent'), false);
}

function replay(id, ep, upto, speed = 1) {
  if (!D.mission) { const c = $(id); if (c) c.replaceWith(Object.assign(document.createElement('div'), {className: 'muted', textContent: 'No patrol simulated for this scan yet.'})); return; }
  const S = D.mission.episodes[ep].steps.slice(0, upto), lab = $(id + 's');
  let k = 0;
  const tick = () => {
    if (!$(id)) return;
    drawMap(id, k, S);
    const st = S[k], err = Math.hypot(st[4] - st[1], st[5] - st[2]);
    if (lab) lab.textContent = `${Math.round(st[0])} s · ${D.mission.modes[st[8]]} · ${Math.round(st[7] * 100)} % sure · guess ${err < 10 ? Math.round(err * 100) + ' cm' : 'far'} from the truth`;
    k = (k + speed) % S.length;
    anim = setTimeout(() => requestAnimationFrame(tick), 60);
  };
  tick();
}
start();
</script>
</body>
</html>
